name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ares CLI
        run: npm install -g @webos-tools/cli

      - name: Install icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Syntax checks
        run: |
          node --check app/app.js
          for f in app/init/*.sh; do sh -n "$f"; done

      - name: Build IPK
        run: ./build.sh

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --generate-notes shells out to git, so this needs the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: ipk
          path: dist

      # The manifest must describe these exact bytes, so generate it here
      # from the built artifact (a committed copy would go stale every build).
      - name: Generate manifest and stable asset names
        run: |
          IPK=$(ls dist/*.ipk)
          ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('app/appinfo.json')).id)")
          node scripts/gen-manifest.js "$IPK" > "dist/${ID}.manifest.json"
          cp "$IPK" "dist/${ID}.ipk"
          cat "dist/${ID}.manifest.json"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('app/appinfo.json')).id)")
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "dist/${ID}.ipk" "dist/${ID}.manifest.json" --clobber
          else
            gh release create "${{ github.ref_name }}" "dist/${ID}.ipk" "dist/${ID}.manifest.json" --title "${{ github.ref_name }}" --generate-notes
          fi
