name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: dns-filter/package.json

      - name: Install ares CLI
        run: npm install -g @webos-tools/cli

      - name: Install icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Syntax checks
        run: |
          for f in app/*.js; do node --check "$f"; done
          for f in app/init/*.sh; do sh -n "$f"; done
          sh -n dns-filter/scripts/tv-handoff.sh

      - name: Domain selection regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Build IPK
        run: ./build.sh

      - name: Purge UI regression
        run: node tests/purge-ui.js

      - name: DNS unit tests
        run: cd dns-filter && bun test

      # Run the DNS filter bundle under the Node releases the TVs ship:
      # 0.12 on webOS 3.x and 8.12 on webOS 4-6.
      - name: DNS filter smoke tests on TV Node versions
        run: |
          while read -r version sha256; do
            tarball="node-v${version}-linux-x64.tar.gz"
            curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://nodejs.org/dist/v${version}/${tarball}"
            echo "${sha256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
            echo "Node ${version}:"
            (cd dns-filter && NOSPY_DNS_NODE="$RUNNER_TEMP/node-v${version}-linux-x64/bin/node" bun run smoke)
          done <<'EOF'
          0.12.18 990b3b39b6290000da1c9fdb5352c2e81fca4e6eeaecfce77c46b3cea1a68dba
          8.12.0 3df19b748ee2b6dfe3a03448ebc6186a3a86aeab557018d77a0f7f3314594ef6
          EOF

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --generate-notes shells out to git, so this needs the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: ipk
          path: dist

      # The manifest must describe these exact bytes, so generate it here
      # from the built artifact (a committed copy would go stale every build).
      - name: Generate manifest and stable asset names
        run: |
          IPK=$(ls dist/*.ipk)
          ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('app/appinfo.json')).id)")
          node scripts/gen-manifest.js "$IPK" > "dist/${ID}.manifest.json"
          cp "$IPK" "dist/${ID}.ipk"
          cat "dist/${ID}.manifest.json"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('app/appinfo.json')).id)")
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "dist/${ID}.ipk" "dist/${ID}.manifest.json" --clobber
          else
            gh release create "${{ github.ref_name }}" "dist/${ID}.ipk" "dist/${ID}.manifest.json" --title "${{ github.ref_name }}" --generate-notes
          fi
