name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ares CLI
        run: npm install -g @webos-tools/cli

      - name: Install icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Syntax checks
        run: |
          node --check app/app.js
          for f in app/init/*.sh; do sh -n "$f"; done

      - name: Build IPK
        run: ./build.sh

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --generate-notes shells out to git, so this needs the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ipk
          path: dist

      # Stable asset name; the manifest (committed in-repo) points at
      # releases/latest/download/<this name>.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          cp dist/*.ipk dist/ooo.lew.lifesgoodwithoutspying.ipk
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/ooo.lew.lifesgoodwithoutspying.ipk --clobber
          else
            gh release create "${{ github.ref_name }}" dist/ooo.lew.lifesgoodwithoutspying.ipk --title "${{ github.ref_name }}" --generate-notes
          fi
